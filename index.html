<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9ebee">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="รายรับจ่าย">
<title>รายรับ รายจ่าย</title>
<style>
:root{--bl:#7b9ac7;--co:#e0897a;--tl:#5f9c8e;--yl:#f2cf5b;--lm:#b9d36a;--pk:#f4b9a8;--lb:#bcd3ea;--ink:#2b2d31;--mut:#7d828b;--gr:#5f9c8e;--rd:#e0897a}
*{box-sizing:border-box;font-family:-apple-system,"Sarabun","Noto Sans Thai",system-ui,sans-serif}
html{background:linear-gradient(120deg,#f6f7f9 0%,#d7dbe1 22%,#eef0f3 45%,#c9ced6 70%,#eceef1 100%) fixed;min-height:100%}
body{margin:0 auto;max-width:720px;color:var(--ink);padding:max(12px,env(safe-area-inset-top)) 12px 100px}
.card{background:linear-gradient(145deg,#fbfcfd,#e4e7ec);border:1px solid rgba(255,255,255,.9);border-radius:30px;box-shadow:8px 8px 18px rgba(125,133,148,.32),-6px -6px 14px rgba(255,255,255,.95);padding:14px 16px;margin:14px 0}
.h,.h2{display:flex;align-items:center;gap:10px}.h{cursor:pointer}.h b,.h2 b:nth-child(2){flex:1}
.h i{font-style:normal;color:var(--mut);width:28px;height:28px;border-radius:50%;background:#fff;text-align:center;line-height:28px;box-shadow:0 2px 5px rgba(0,0,0,.15)}
.ic{width:42px;height:42px;flex:none;border-radius:15px;display:grid;place-items:center;font-size:22px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.1),0 4px 8px rgba(0,0,0,.18)}
.ri{width:30px;height:30px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:16px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.12)}
.mut{color:var(--mut);font-size:13px}
.r{display:flex;align-items:center;gap:8px;padding:5px 0}.r>span:not(.ri),.r>b:first-child{flex:1}
input{font-size:15px;outline:0}
input.n{width:92px;text-align:right;border-radius:999px;border:1px solid #fff;background:rgba(255,255,255,.8);padding:8px 12px;box-shadow:inset 0 2px 4px rgba(0,0,0,.09)}
input.n.b{width:78px;color:var(--mut);background:rgba(255,255,255,.45)}
input[type=date]{border:1px solid #fff;border-radius:999px;padding:8px 12px;background:rgba(255,255,255,.8)}
.btn{border:1px solid #fff;border-radius:999px;background:linear-gradient(180deg,#fff,#e6e9ee);padding:9px 16px;font-size:15px;color:var(--ink);box-shadow:0 3px 8px rgba(120,130,150,.25)}
.btn.p{background:linear-gradient(180deg,#8fb7a9,#5f9c8e);color:#fff}.btn.c{background:linear-gradient(180deg,#eaa294,#e0897a);color:#fff}
.nv{display:flex;align-items:center;justify-content:space-between;padding:4px 6px}.nv b{font-size:18px}
.tr{height:16px;border-radius:99px;background:#fff;box-shadow:inset 0 2px 4px rgba(0,0,0,.1);overflow:hidden}.tr div{height:100%;border-radius:99px}
.stk{display:flex;gap:2px;height:20px;border-radius:99px;overflow:hidden;background:#fff;box-shadow:inset 0 2px 4px rgba(0,0,0,.12);margin:10px 0}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px}.lgi{display:flex;align-items:center;gap:5px}.lgi i{width:10px;height:10px;border-radius:50%;flex:none}.lgi b{margin-left:auto}
.lx{display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0}.lx i{width:10px;height:10px;border-radius:50%}.lx span{flex:1}
.big{font-size:28px;font-weight:700;text-align:center;margin-top:10px}
.sub{margin:10px 0 2px;font-size:13px;color:var(--mut);display:flex;justify-content:space-between}
.in{background:rgba(255,255,255,.6);border-radius:24px;padding:14px;margin:10px 0}
.dv{border-top:1.5px dashed #c9ced6;margin:10px 0}
.pill{border:1.5px solid #d6a99d;color:#b9695a;border-radius:999px;padding:3px 12px;font-size:13px}
.ed{color:#b98a3e;text-decoration:underline;font-size:13px}
.dbn{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cd{min-height:54px;border-radius:14px;padding:4px 2px;font-size:11px;background:rgba(255,255,255,.6)}.cd small{display:block;color:var(--mut);font-size:12px}
.cd.g{background:#d3ebe2;color:#2c7a64}.cd.r{background:#f8d8d1;color:#b0503f}.cd b{font-size:11px}
.wk{font-size:12px;color:var(--mut)}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;background:rgba(240,242,245,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #fff;border-radius:999px;padding:5px;box-shadow:0 8px 24px rgba(110,120,140,.35);z-index:9}
.tabs button{border:0;background:none;border-radius:999px;padding:11px 20px;font-size:15px;color:var(--mut)}
.tabs button.on{background:linear-gradient(180deg,#f7dc7a,#e8b93f);color:var(--ink);font-weight:600;box-shadow:0 3px 8px rgba(200,150,30,.4)}
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 6px}
</style>
</head>
<body>
<div class="top"><b style="font-size:20px">รายรับ รายจ่าย</b><button class="btn" id="st" onclick="login()"></button></div>
<div id="app"></div>
<div class="tabs" id="tabs"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== ใส่ค่า Firebase ของคุณตรงนี้ (ดูขั้นตอนในคู่มือ) ===== */
const FB={apiKey:"AIzaSyAODS6PlmZD_oZbICIc-MDpsqtQAJBiPxs",authDomain:"me-pocket-66a6d.firebaseapp.com",projectId:"me-pocket-66a6d",appId:"1:1018550855738:web:4510dbd7b000cb39feed03"};
/* ============================================================ */

const INC=['K Bank','SCB','BBL','KTB','7-11','BTS','MRT','Cash','Others'];
const G=[['Fixed',[['Mom',5000],['Child',10000],['Psy',4500]]],
 ['Utilities',[['Mobile',1100],['Net',700],['Watch',200],['Netflix',619],['Electric',3000],['Water',200],['Mid cost',2380],['Insure',20000]]],
 ['Pay',[['BBL',8000],['Line BK',12000]]]];
const WD=[['ค่าเดินทาง',['Motorcycle เช้า','MRT เช้า','Van','BTS เช้า','BTS เย็น','MRT เย็น','Express']],['ค่ากิน',['Breakfast','Launch','Dinner']],['ใช้จ่ายอื่นๆ',['ซื้อของ','อื่นๆ']]];
const WE=[['ค่าเดินทาง',['Oil','Express']],['ค่ากิน',['Small meal','Big meal','Others']]];
const SAV=['Mymo','Dime','ออมสิน','Others'];
const DEBTS=[['BBL',100000],['Line BK',369300]];

const sum=o=>Object.values(o||{}).reduce((a,b)=>a+(+b||0),0);
const fmt=n=>Math.round(+n||0).toLocaleString('en-US');
const p2=n=>String(n).padStart(2,'0');
const ym=d=>d.getFullYear()+'-'+p2(d.getMonth()+1);
const ymd=d=>ym(d)+'-'+p2(d.getDate());
const dt=s=>new Date(s+'T00:00');
const thm=d=>d.toLocaleDateString('th-TH',{month:'long',year:'numeric'});

let D={bud:{},tot:{},m:{},d:{},debt:[],sav:{}};
try{Object.assign(D,JSON.parse(localStorage.ft||'{}'))}catch(e){}
let tab='ov',C={rem:1,sumi:1,sume:1,inc:1,gFixed:1,gUtilities:1,gPay:1,debt:1},now=new Date(),cur=new Date(now.getFullYear(),now.getMonth(),1),sel=ymd(now);

/* ---------- เก็บข้อมูล / ซิงก์ ---------- */
let fs=null,user=null,tm;
function save(){
  localStorage.ft=JSON.stringify(D);
  if(fs&&user){clearTimeout(tm);tm=setTimeout(()=>fs.doc('users/'+user.uid).set(D).catch(()=>{}),400)}
}
function status(){
  const b=document.getElementById('st');
  b.textContent=!FB.apiKey?'เก็บในเครื่อง':user?'✓ ซิงก์แล้ว':'เข้าสู่ระบบ Google';
}
function login(){
  if(!FB.apiKey){alert('ยังไม่ได้ใส่ค่า Firebase ในไฟล์ index.html (ดูคู่มือขั้นตอนที่ 5)');return}
  if(user){if(confirm('ออกจากระบบ?'))firebase.auth().signOut();return}
  firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>alert('เข้าสู่ระบบไม่สำเร็จ: '+e.message));
}
if(FB.apiKey&&window.firebase){
  firebase.initializeApp(FB);fs=firebase.firestore();
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  firebase.auth().onAuthStateChanged(u=>{
    user=u;status();
    if(u)fs.doc('users/'+u.uid).onSnapshot(s=>{
      if(!s.exists){save();return}
      if(s.metadata.hasPendingWrites)return;
      D=Object.assign({bud:{},tot:{},m:{},d:{},debt:[],sav:{}},s.data());
      localStorage.ft=JSON.stringify(D);render();
    });
  });
}

/* ---------- คำนวณ ---------- */
const mo=M=>D.m[M]||{inc:{},exp:{}};
const daySum=M=>Object.keys(D.d).filter(k=>k.startsWith(M)).reduce((s,k)=>s+sum(D.d[k]),0);
const expTot=M=>sum(mo(M).exp)+daySum(M);
const dKey=s=>{const w=dt(s).getDay();return w==0?'sun':w==6?'sat':'wd'};
const dBud=s=>D.bud[dKey(s)]??({wd:444,sat:2000,sun:2000})[dKey(s)];
const bdg=(g,n,d)=>D.bud[g+'.'+n]??d;

function S(t,k,v){
  v=+v||0;const M=ym(cur);
  if(t=='bud')D.bud[k]=v;
  else if(t=='tot')D.tot[k]=v;
  else if(t=='d')(D.d[sel]=D.d[sel]||{})[k]=v;
  else if(t=='sav')(D.sav[M]=D.sav[M]||{})[k]=v;
  else{const m=D.m[M]=D.m[M]||{inc:{},exp:{}};m[t][k]=v}
  save();render();
}
function DB(a,t){
  const el=document.getElementById('x'+a.replace(' ','')),v=+el.value;
  if(!v)return;D.debt.push({a,t,v,date:ymd(new Date())});save();render();
}
function ED(a,f){
  D[f]=D[f]||{};const o=prompt('ระบุจำนวนเงิน',D[f][a]??'');
  if(o===null)return;D[f][a]=+String(o).replace(/,/g,'')||0;save();render();
}
function UN(a){const i=D.debt.map(x=>x.a).lastIndexOf(a);if(i>=0&&confirm('ยกเลิกรายการล่าสุดของ '+a+'?')){D.debt.splice(i,1);save();render()}}
function T(id){C[id]=!C[id];render()}
function mv(n){
  cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);
  if(sel.slice(0,7)!=ym(cur))sel=ym(cur)+'-01';
  render();
}
function dv(n){const d=dt(sel);d.setDate(d.getDate()+n);sel=ymd(d);cur=new Date(d.getFullYear(),d.getMonth(),1);render()}
function go(s){sel=s;tab='ov';render();window.scrollTo(0,0)}
function setTab(t){tab=t;render();window.scrollTo(0,0)}

/* ---------- ชิ้นส่วน UI ---------- */
const inp=(t,k,v,c)=>`<input class="n ${c||''}" type="number" inputmode="decimal" placeholder="0" value="${v||''}" onchange="S('${t}','${k}',this.value)">`;
const card=h=>`<div class="card">${h}</div>`;
const sec=(id,title,right,body)=>`<div class="card"><div class="h" onclick="T('${id}')"><b>${title}</b><span class="mut">${right}</span><i>${C[id]?'▸':'▾'}</i></div>${C[id]?'':'<div style="margin-top:8px">'+body+'</div>'}</div>`;
const nav=()=>`<div class="nv"><button class="btn" onclick="mv(-1)">‹</button><b>${thm(cur)}</b><button class="btn" onclick="mv(1)">›</button></div>`;
const bar=(t,v,mx,c)=>`<div style="margin-top:10px"><div class="r"><span>${t}</span><b>${fmt(v)}</b></div><div class="tr"><div style="width:${v/mx*100}%;background:${c}"></div></div></div>`;
const donut=(paid,total)=>{const p=total>0?Math.min(1,paid/total):0;
 return `<svg viewBox="0 0 100 100" width="118" height="118"><circle cx="50" cy="50" r="40" fill="none" stroke="#dde3ef" stroke-width="14"/><circle cx="50" cy="50" r="40" fill="none" stroke="#6f93d6" stroke-width="14" stroke-linecap="round" stroke-dasharray="${p*251.3} 251.3" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" font-size="17" font-weight="700" fill="#1d1f24">${Math.round(p*100)}%</text></svg>`};

/* ---------- แท็บ Overview ---------- */
const IC={'K Bank':'🏦','SCB':'🏛️','BBL':'🏢','KTB':'🏤','7-11':'🏪','BTS':'🚈','MRT':'🚇','Cash':'💵','Others':'✨','Mom':'👩','Child':'🧒','Psy':'🩺','Mobile':'📱','Net':'🌐','Watch':'⌚','Netflix':'🎬','Electric':'💡','Water':'💧','Mid':'🧾','Insure':'🛡️','Line':'💳','Motorcycle':'🏍️','Van':'🚐','Express':'🛣️','Breakfast':'🍳','Launch':'🍱','Dinner':'🍜','ซื้อของ':'🛍️','อื่นๆ':'✨','Oil':'⛽','Small':'🥪','Big':'🍽️','ค่าเดินทาง':'🚌','ค่ากิน':'🍽️','ใช้จ่ายอื่นๆ':'🛍️','Mymo':'🪙','Dime':'📈','ออมสิน':'🏧'};
const ic=n=>IC[n]||IC[n.split(' ')[0]]||'•';
const rI=n=>`<span class="ri">${ic(n)}</span>`;
const ICOL=['#7b9ac7','#e0897a','#5f9c8e','#f2cf5b','#b9d36a','#f4b9a8','#bcd3ea','#a79ad0','#c3c8d0'];
const GC=['#e0897a','#f2cf5b','#7b9ac7','#5f9c8e'],GI={Fixed:'🏠',Utilities:'🔌',Pay:'💳',Daily:'📅'};
const stack=p=>`<div class="stk">${p.filter(x=>x[1]>0).map(x=>`<div style="flex:${x[1]};background:${x[2]}"></div>`).join('')}</div>`;
const sec2=(id,title,right,body,ico,col,tint,pre)=>`<div class="card" style="background:linear-gradient(145deg,#fdfdfe,${tint})"><div class="h" onclick="T('${id}')"><span class="ic" style="background:${col}">${ico}</span><b>${title}</b><span class="mut">${right}</span><i>${C[id]?'▸':'▾'}</i></div>${pre||''}${C[id]?'':'<div style="margin-top:10px">'+body+'</div>'}</div>`;
const mdays=M=>{const[y,m]=M.split('-');return new Date(y,m,0).getDate()};
const fmt2=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const ring=(used,tot)=>{const p=tot>0?Math.max(0,Math.min(1,used/tot)):0;
 return `<svg viewBox="0 0 100 100" width="130" height="130" style="flex:none"><circle cx="50" cy="50" r="38" fill="none" stroke="#5f9c8e" stroke-width="15"/><circle cx="50" cy="50" r="38" fill="none" stroke="#e0897a" stroke-width="15" stroke-dasharray="${p*238.76} 238.76" transform="rotate(-90 50 50)"/></svg>`};

function ov(){
  const M=ym(cur),m=mo(M),inc=sum(m.inc),ex=expTot(M),left=inc-ex;
  const gs=G.map(([g,items],i)=>{let a=0,b=0;items.forEach(([n,d])=>{a+=+m.exp[g+'.'+n]||0;b+=bdg(g,n,d)});return{g,a,b,c:GC[i]}});
  let dB=0;for(let d=1;d<=mdays(M);d++)dB+=dBud(M+'-'+p2(d));
  gs.push({g:'Daily',a:daySum(M),b:dB,c:GC[3]});
  const bT=gs.reduce((s,x)=>s+x.b,0),bL=bT-ex;
  let h=nav();
  const pl=inc>0?Math.max(0,left)/inc*100:0,pb=bT>0?Math.max(0,bL)/bT*100:0;
  const remPre=`<div class="r" style="margin-top:8px"><span>💰 เหลือจากรายรับ</span><b style="color:${left<0?'#c0584a':'#2c7a64'}">${fmt(left)} (${Math.round(pl)}%)</b></div><div class="tr"><div style="width:${pl}%;background:linear-gradient(90deg,#b9d36a,#5f9c8e)"></div></div><div class="r" style="margin-top:6px"><span>🎯 งบที่ยังใช้ได้อีก</span><b style="color:${bL<0?'#c0584a':'#4a7bb5'}">${fmt(bL)} (${Math.round(pb)}%)</b></div><div class="tr"><div style="width:${pb}%;background:linear-gradient(90deg,#bcd3ea,#7b9ac7)"></div></div>`;
  h+=sec2('rem','เงินคงเหลือ',fmt(left)+' ฿',`<div class="big" style="margin-top:0;color:${left<0?'#c0584a':'#2c7a64'}">${fmt(left)} ฿</div><div class="mut" style="text-align:center">รายรับ − รายจ่ายจริง</div><div class="mut" style="text-align:right;margin-top:8px">ใช้ไป ${fmt(ex)} จากงบรวม ${fmt(bT)}</div>`,'💰','#f2cf5b','#fdf1c4',remPre);
  h+=sec2('sumi','รายรับรวม',fmt(inc)+' ฿',`<div class="lg">${INC.map((k,i)=>`<div class="lgi"><i style="background:${ICOL[i]}"></i>${ic(k)} ${k}<b>${fmt(m.inc[k])}</b></div>`).join('')}</div>`,'📥','#b9d36a','#eaf3cf',stack(INC.map((k,i)=>[k,m.inc[k],ICOL[i]])));
  h+=sec2('sume','รายจ่ายรวม',fmt(ex)+' ฿',gs.map(x=>`<div class="lx"><i style="background:${x.c}"></i><span>${GI[x.g]} ${x.g} · ใช้ ${fmt(x.a)} / งบ ${fmt(x.b)}</span><b style="color:${x.b-x.a<0?'#c0584a':'#2c7a64'}">เหลือ ${fmt(x.b-x.a)}</b></div>`).join(''),'📤','#e0897a','#fadfd7',stack(gs.map(x=>[x.g,x.a,x.c])));
  h+=sec2('inc','รายรับ',fmt(inc),INC.map(k=>`<div class="r">${rI(k)}<span>${k}</span>${inp('inc',k,m.inc[k])}</div>`).join(''),'📥','#b9d36a','#eaf3cf');
  const w=dt(sel).getDay(),tpl=(w==0||w==6)?WE:WD,dd=D.d[sel]||{},sp=sum(dd),bu=dBud(sel),df=bu-sp;
  const dn=dt(sel).toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'short'});
  let body=`<div class="r"><button class="btn" onclick="dv(-1)">‹</button><input type="date" value="${sel}" onchange="sel=this.value;cur=new Date(dt(sel).getFullYear(),dt(sel).getMonth(),1);render()" style="flex:1"><button class="btn" onclick="dv(1)">›</button></div>
  <div class="r"><span>🎯 งบวันนี้ (แก้ได้)</span>${inp('bud',dKey(sel),bu,'b')}</div>
  <div class="r"><span>ใช้ไปแล้ว</span><b style="color:${df<0?'#c0584a':'#2c7a64'}">${fmt(sp)} (${df<0?'เกิน ':'เหลือ '}${fmt(Math.abs(df))})</b></div>`;
  tpl.forEach(([g,its])=>{body+=`<div class="sub"><span>${ic(g)} ${g}</span></div>`+its.map(n=>`<div class="r">${rI(n)}<span>${n}</span>${inp('d',g+'.'+n,dd[g+'.'+n])}</div>`).join('')});
  h+=sec2('daily','Daily · '+dn,`${fmt(sp)} / ${fmt(bu)}`,body,'📅','#5f9c8e','#d8ece6');
  const tints=['#fadfd7','#fdf1c4','#dde8f6'];
  G.forEach(([g,items],i)=>{
    const x=gs[i];
    const rows=items.map(([n,d])=>{const k=g+'.'+n;return `<div class="r">${rI(n)}<span>${n}</span>${inp('bud',k,bdg(g,n,d),'b')}${inp('exp',k,m.exp[k])}</div>`}).join('');
    h+=sec2('g'+g,'จ่าย: '+g,`${fmt(x.a)} / ${fmt(x.b)}`,`<div class="sub"><span></span><span>งบ (แก้ได้) &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ใช้จริง</span></div>`+rows,GI[g],GC[i],tints[i]);
  });
  // Debt (แสดงแบบรูปอ้างอิง)
  let dh='',allUsed=0;
  DEBTS.forEach(([a,def],i)=>{
    const L=D.debt.filter(x=>x.a==a),paid=L.filter(x=>x.t=='pay').reduce((s,x)=>s+x.v,0),add=L.filter(x=>x.t=='add').reduce((s,x)=>s+x.v,0);
    const lim=D.tot?.[a]??def,used=(D.used0?.[a]||0)+add-paid,rem=lim-used,pc=lim>0?Math.round(used/lim*100):0,id=a.replace(' ','');allUsed+=used;
    dh+=`<div class="in"><div class="r"><div style="flex:1"><b style="font-size:22px">${a.toUpperCase()}</b><div class="mut">${a=='BBL'?'ธนาคารกรุงเทพ':'ไลน์ แบงก์'}</div></div><span class="pill">ใช้แล้ว ${pc}%</span></div><div class="dv"></div>
    <div style="display:flex;align-items:center;gap:14px">${ring(used,lim)}<div style="flex:1;font-size:14px">
    <div class="r"><span>วงเงินเต็ม <a class="ed" onclick="ED('${a}','tot')">แก้ไข</a></span><span class="dbn">${fmt2(lim)}</span></div>
    <div class="r"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#e0897a"></i> ใช้ไปแล้ว <a class="ed" onclick="ED('${a}','used0')">ตั้งต้น</a></span><span class="dbn" style="color:#c0584a">${fmt2(used)}</span></div>
    <div class="r"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#5f9c8e"></i> เหลือใช้ได้</span><span class="dbn" style="color:#2c7a64;font-size:17px">${fmt2(rem)}</span></div></div></div><div class="dv"></div>
    <div class="r"><input class="n" id="x${id}" type="number" inputmode="decimal" placeholder="ระบุจำนวนเงิน" style="flex:1;width:auto;border-radius:14px;padding:12px"><button class="btn p" style="border-radius:14px;padding:12px 18px" onclick="DB('${a}','pay')">จ่ายเพิ่ม</button></div>
    <button class="btn c" style="width:100%;border-radius:14px;padding:12px" onclick="DB('${a}','add')">กู้เพิ่ม</button>
    <div style="text-align:right;margin-top:6px"><a class="ed" onclick="UN('${a}')">ยกเลิกรายการล่าสุด</a></div></div>`;
  });
  h+=sec2('debt','Debt (แยกจากส่วนอื่น)','ใช้แล้วรวม '+fmt(allUsed),dh,'🏦','#e0897a','#fadfd7');
  return h;
}

/* ---------- แท็บ Monthly ---------- */
let tx=0;
function monthly(){
  const y=cur.getFullYear(),mI=cur.getMonth(),M=ym(cur),first=new Date(y,mI,1).getDay(),n=new Date(y,mI+1,0).getDate();
  let cells='';for(let i=0;i<first;i++)cells+='<div></div>';
  for(let d=1;d<=n;d++){
    const s=M+'-'+p2(d),e=D.d[s];let c='',t='';
    if(e&&sum(e)>0){const df=dBud(s)-sum(e);c=df>=0?'g':'r';t=(df>=0?'+':'−')+fmt(Math.abs(df))}
    cells+=`<div class="cd ${c}" onclick="go('${s}')"><small>${d}</small><b>${t}</b></div>`;
  }
  let h=nav()+`<div class="card" style="background:linear-gradient(145deg,#fdfdfe,#dde8f6)" ontouchstart="tx=event.touches[0].clientX" ontouchend="const d=event.changedTouches[0].clientX-tx;if(Math.abs(d)>60)mv(d<0?1:-1)"><div class="cal" style="margin-bottom:6px">${['อา','จ','อ','พ','พฤ','ศ','ส'].map(x=>`<span class="wk">${x}</span>`).join('')}</div><div class="cal">${cells}</div><div class="mut" style="margin-top:10px;text-align:center">เขียว = ประหยัดได้ · แดง = ใช้เกินงบ · เลื่อนซ้าย-ขวาเปลี่ยนเดือน</div></div>`;
  const ms=[];for(let i=5;i>=0;i--)ms.push(new Date(y,mI-i,1));
  const vals=ms.map(d=>[sum(mo(ym(d)).inc),expTot(ym(d))]),mx=Math.max(1,...vals.flat());
  let sv='';
  ms.forEach((d,i)=>{const x=i*56+12;
    vals[i].forEach((v,j)=>{const hh=v/mx*120;sv+=`<rect x="${x+j*20}" y="${140-hh}" width="16" height="${hh}" rx="6" fill="${j?'#e5636b':'#4caf7d'}" opacity=".85"/>`});
    sv+=`<text x="${x+18}" y="158" text-anchor="middle" font-size="10" fill="#7b8089">${d.toLocaleDateString('th-TH',{month:'short'})}</text>`});
  h+=card(`<b>📊 รายรับ-รายจ่าย 6 เดือนล่าสุด</b><svg viewBox="0 0 348 165" width="100%" style="margin-top:8px">${sv}</svg><div class="mut" style="text-align:center"><span style="color:var(--gr)">■</span> รายรับ &nbsp; <span style="color:var(--rd)">■</span> รายจ่าย</div>`);
  const t=ms[5];h+=card(`<div class="r"><span>เดือนนี้ รายรับ</span><b>${fmt(vals[5][0])}</b></div><div class="r"><span>เดือนนี้ รายจ่าย</span><b>${fmt(vals[5][1])}</b></div><div class="r"><span>คงเหลือ</span><b>${fmt(vals[5][0]-vals[5][1])}</b></div>`);
  return h;
}

/* ---------- แท็บ Saving ---------- */
const savTot=M=>sum(D.sav[M]);
function saving(){
  const M=ym(cur),y=cur.getFullYear(),mI=cur.getMonth(),s=D.sav[M]||{};
  const ms=[];for(let i=11;i>=0;i--)ms.push(new Date(y,mI-i,1));
  const v=ms.map(d=>savTot(ym(d))),mx=Math.max(1,...v),mn=Math.min(...v,0),rg=(mx-mn)||1;
  const X=i=>20+i*(308/11),Y=x=>130-(x-mn)/rg*110;
  const pts=v.map((x,i)=>X(i)+','+Y(x)).join(' ');
  let sv=`<polyline points="${pts}" fill="none" stroke="#6f93d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  v.forEach((x,i)=>{sv+=`<circle cx="${X(i)}" cy="${Y(x)}" r="4" fill="#fff" stroke="#6f93d6" stroke-width="2.5"/>`;
    if(i%2==1||i==11)sv+=`<text x="${X(i)}" y="152" text-anchor="middle" font-size="10" fill="#7b8089">${ms[i].toLocaleDateString('th-TH',{month:'short'})}</text>`});
  sv+=`<text x="${X(11)}" y="${Y(v[11])-10}" text-anchor="end" font-size="11" font-weight="700" fill="#1d1f24">${fmt(v[11])}</text>`;
  return nav()+card(`<b>🐷 ยอด Saving รวมแต่ละเดือน</b><svg viewBox="0 0 348 160" width="100%" style="margin-top:8px">${sv}</svg>`)
   +card(`<div class="r"><b>🪙 ถัง Saving เดือนนี้</b><b style="color:var(--bl)">${fmt(sum(s))} ฿</b></div>`+SAV.map(k=>`<div class="r">${rI(k)}<span>${k}</span>${inp('sav',k,s[k])}</div>`).join('')+`<div class="mut">กรอกยอดคงเหลือของแต่ละถังตอนสิ้นเดือน</div>`);
}

function render(){
  document.getElementById('app').innerHTML=tab=='ov'?ov():tab=='mo'?monthly():saving();
  document.getElementById('tabs').innerHTML=[['ov','Over View'],['mo','Monthly'],['sv','Saving']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  status();
}
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
